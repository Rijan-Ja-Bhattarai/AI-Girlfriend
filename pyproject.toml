[project]
name = "llm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rijan Bhattarai", email = "rijanbhattarai2006@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "datasets>=5.1.0",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "mypy>=2.4.0",
    "numpy>=2.5.4",
    "tiktoken>=0.14.0",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
]

[project.scripts]
llm = "llm:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
